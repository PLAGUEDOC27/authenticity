<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit User</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.main {
    margin-left: 250px;
    padding: 34px;
}

.form-card {
    max-width: 600px;
    margin: auto;
    padding: 24px;
}
</style>

<link rel="stylesheet" href="{{ url_for('static', filename='css/glass_theme.css') }}">
</head>

<body>

{% include "sidebar.html" %}

<div class="main">

    <div class="card form-card">

        <h4 class="mb-3">Edit User</h4>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
            <div class="alert alert-{{ category }}">{{ msg }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <label>Username</label>
                <input name="username" class="form-control" value="{{ user.username }}" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input name="email" class="form-control" value="{{ user.email }}" required>
            </div>

            <div class="mb-3">
                <label>Role</label>
                <select name="role" class="form-select">
                    <option value="user" {% if user.role=="user" %}selected{% endif %}>User</option>
                    <option value="recruiter" {% if user.role=="recruiter" %}selected{% endif %}>Recruiter</option>
                    <option value="admin" {% if user.role=="admin" %}selected{% endif %}>Admin</option>
                </select>
            </div>

            <button class="btn w-100">Update User</button>

        </form>

    </div>

</div>

</body>
</html>
