<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Documents - Authenticity</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
.main {
    margin-left: 250px;
    padding: 40px;
    min-height: 100vh;
}

.compare-card {
    max-width: 980px;
    margin: auto;
    padding: 34px;
}

.compare-title {
    text-align: center;
    margin-bottom: 32px;
}

.compare-title h4 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.select-box {
    min-height: 135px;
    padding: 22px;
    border-radius: 18px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.12);
    transition: 0.25s ease;
}

.select-box:hover {
    border-color: rgba(0,229,255,0.45);
    box-shadow: 0 0 25px rgba(0,229,255,0.12);
    transform: translateY(-2px);
}

.select-box label {
    display: block;
    margin-bottom: 10px;
    font-weight: 700;
}

.divider {
    height: 1px;
    background: rgba(255,255,255,0.12);
    margin: 30px 0;
}

.btn-compare {
    height: 52px;
    font-size: 15px;
}

@media (max-width: 900px) {
    .main {
        margin-left: 0;
        padding: 24px;
    }
}
</style>

<link rel="stylesheet" href="{{ url_for('static', filename='css/glass_theme.css') }}">
</head>

<body>

{% include "sidebar.html" %}

<div class="main">

    <form action="/compare" method="GET" class="compare-card">

        <div class="compare-title">
            <h4>Compare Documents</h4>
            <p class="text-muted mb-0">
                Select two documents to analyze textual similarity
            </p>
        </div>

        <div class="row g-4">

            <div class="col-md-6">
                <div class="select-box">
                    <label>
                        <i class="bi bi-file-earmark-text me-2"></i>
                        Document A
                    </label>

                    <select name="a" class="form-select" required>
                        <option value="">Choose document...</option>
                        {% for doc in documents %}
                        <option value="{{ doc.id }}">{{ doc.filename }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="col-md-6">
                <div class="select-box">
                    <label>
                        <i class="bi bi-file-earmark-text me-2"></i>
                        Document B
                    </label>

                    <select name="b" class="form-select" required>
                        <option value="">Choose document...</option>
                        {% for doc in documents %}
                        <option value="{{ doc.id }}">{{ doc.filename }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

        </div>

        <div class="divider"></div>

        <button class="btn btn-compare w-100">
            <i class="bi bi-intersect me-2"></i>
            Compare Now
        </button>

    </form>

</div>

<script>
document.querySelector("form").addEventListener("submit", function(e) {
    const a = this.a.value;
    const b = this.b.value;

    if (a === b) {
        e.preventDefault();
        alert("Please select two different documents.");
    }
});
</script>

</body>
</html>
