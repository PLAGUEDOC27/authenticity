<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Authenticity | Access Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #0d0d0d;
    --purple: #7401c0;
    --cyan: #00e5ff;
    --green: #0f9f75;
    --text-dark: #111827;
    --text-muted: #64748b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 15% 20%, rgba(116, 1, 192, 0.35), transparent 32%),
        radial-gradient(circle at 85% 25%, rgba(0, 229, 255, 0.22), transparent 34%),
        linear-gradient(135deg, #09090b, #0d0d0d);
    padding: 24px;
}

/* MAIN AUTH CARD */
.auth-container {
    width: 920px;
    min-height: 430px;
    display: flex;
    overflow: hidden;
    border-radius: 20px;
    background: rgba(20, 19, 19, 0.699);
    box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.12);
}

/* LEFT BRAND PANEL */
.auth-left {
    width: 50%;
    background:
        linear-gradient(135deg, rgba(15,159,117,0.96), rgba(5,150,105,0.96)),
        radial-gradient(circle at top left, rgba(255,255,255,0.22), transparent 35%);
    color: white;
    padding: 56px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.auth-left h2 {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -0.8px;
}

.auth-left p {
    font-size: 15px;
    line-height: 1.7;
    opacity: 0.85;
    max-width: 340px;
}

/* RIGHT PANEL */
.auth-right {
    width: 50%;
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* TABS */
.nav-tabs {
    border: none;
    gap: 10px;
    margin-bottom: 34px !important;
}

.nav-tabs .nav-item {
    flex: 1;
}

.nav-tabs .nav-link {
    width: 100%;
    border: none !important;
    border-radius: 14px !important;
    color: white;
    font-weight: 700;
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--purple), var(--cyan));
    box-shadow: 0 12px 28px rgba(116, 1, 192, 0.25);
    opacity: 0.75;
}

.nav-tabs .nav-link.active {
    color: white !important;
    opacity: 1;
    background: linear-gradient(135deg, var(--purple), var(--cyan)) !important;
    box-shadow: 0 14px 34px rgba(0, 229, 255, 0.24);
}

/* FORM */
label {
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 6px;
}

.form-control {
    height: 46px;
    border-radius: 12px !important;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    font-size: 14px;
}

.form-control:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 4px rgba(0,229,255,0.15);
    background: white;
}

/* BUTTON */
.btn-primary {
    height: 46px;
    border: none !important;
    border-radius: 14px !important;
    font-weight: 700;
    background: linear-gradient(135deg, var(--purple), var(--cyan)) !important;
    box-shadow: 0 16px 32px rgba(116, 1, 192, 0.25);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 38px rgba(0, 229, 255, 0.25);
}

/* ALERT */
.alert {
    border-radius: 12px;
    font-size: 14px;
}

/* RESPONSIVE */
@media (max-width: 850px) {
    .auth-container {
        width: 100%;
        flex-direction: column;
    }

    .auth-left,
    .auth-right {
        width: 100%;
    }

    .auth-left {
        padding: 38px;
    }

    .auth-right {
        padding: 34px;
    }
}
</style>
</head>

<body>

<div class="auth-container">

    <!-- LEFT -->
    <div class="auth-left">
        <h2>Authenticity</h2>
        <p>AI-powered plagiarism detection and resume screening system for smarter document analysis.</p>
    </div>

    <!-- RIGHT -->
    <div class="auth-right">

        <ul class="nav nav-tabs">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">
                    Login
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">
                    Register
                </button>
            </li>
        </ul>

        <div class="tab-content">

            <!-- LOGIN -->
            <div class="tab-pane fade show active" id="login">
                <form method="POST" action="{{ url_for('login') }}">

                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <div class="mb-3">
                        <label>Username</label>
                        <input name="username" class="form-control" placeholder="Enter username" required>
                    </div>

                    <div class="mb-4">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <button class="btn btn-primary w-100">Login</button>
                </form>
            </div>

            <!-- REGISTER -->
            <div class="tab-pane fade" id="register">
                <form method="POST" action="/auth/register">

                    <div class="mb-3">
                        <label>Username</label>
                        <input name="username" class="form-control" placeholder="Choose username" required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
                    </div>

                    <div class="mb-4">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create password" required>
                    </div>

                    <button class="btn btn-primary w-100">Create Account</button>
                </form>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
