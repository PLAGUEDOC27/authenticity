<div class="sidebar">

    <div class="sidebar-brand">
        <h4>Authenticity</h4>
        <span>AI Detection Suite</span>
    </div>

    {% if session.get("role") == "admin" %}

        <!-- ADMIN SECTION -->
        <div class="sidebar-section">Admin</div>

        <a href="/admin" class="{% if active=='admin_dashboard' %}active{% endif %}">
            <i class="bi bi-grid"></i> Admin Dashboard
        </a>

        <a href="/admin/create-user" class="{% if active=='create_user' %}active{% endif %}">
            <i class="bi bi-person-plus"></i> Create User
        </a>

        <!-- PLATFORM SECTION -->
        <div class="sidebar-section">Platform</div>

        <a href="/dashboard" class="{% if active=='dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> System Dashboard
        </a>

        <a href="/documents" class="{% if active=='documents' %}active{% endif %}">
            <i class="bi bi-file-text"></i> Documents
        </a>

        <a href="/compare" class="{% if active=='compare' %}active{% endif %}">
            <i class="bi bi-diagram-3"></i> Compare Docs
        </a>

        <a href="/resume/upload" class="{% if active=='resume' %}active{% endif %}">
            <i class="bi bi-briefcase"></i> Resume Screening
        </a>

    {% else %}

        <!-- USER SECTION -->
        <div class="sidebar-section">Workspace</div>

        <a href="/dashboard" class="{% if active=='dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <a href="/documents" class="{% if active=='documents' %}active{% endif %}">
            <i class="bi bi-file-text"></i> Documents
        </a>

        <a href="/compare" class="{% if active=='compare' %}active{% endif %}">
            <i class="bi bi-diagram-3"></i> Compare Docs
        </a>

        <a href="/resume/upload" class="{% if active=='resume' %}active{% endif %}">
            <i class="bi bi-briefcase"></i> Resume Screening
        </a>

    {% endif %}

    <a href="/logout" class="logout-link">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>

</div>
